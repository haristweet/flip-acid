<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FLIP ACID">
<meta name="theme-color" content="#14161a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>FLIP ACID</title>
<style>
  :root {
    --alu:       #b6b2aa;
    --alu-hi:    #d2cec6;
    --alu-lo:    #8b8780;
    --ink:       #45423c;
    --ink-soft:  #6d6960;
    --window:    #14161a;
    --grid:      #272b31;
    --trace:     #ff6a1f;
    --ghost:     #6d4027;
    --knob:      #24262a;
    --knob-edge: #0d0e10;
    --led:       #ff3b1f;
    --led-dim:   #512a20;
    --led-acc:   #ffd24a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--window);
    touch-action: none;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    color: var(--ink);
  }

  /* ---------- the panel ---------- */

  /* The pad covers the bottom of the screen, so the panel lives in the strip
     above it. --lid is how tall that strip is: measured on a 16 Pro Max,
     adjustable on the device with L2 + up/down. */
  #rig {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: var(--lid, 575px);
    padding-top: env(safe-area-inset-top);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background:
      linear-gradient(176deg, var(--alu-hi) 0%, var(--alu) 22%, var(--alu) 72%, var(--alu-lo) 100%);
  }
  /* brushed texture */
  #rig::before {
    content: "";
    position: absolute; inset: 0;
    background: repeating-linear-gradient(
      93deg,
      rgba(255,255,255,.045) 0 1px,
      rgba(0,0,0,.035) 1px 2px,
      transparent 2px 4px);
    pointer-events: none;
  }

  header {
    flex: none;
    height: 34px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 0 16px;
    position: relative;
  }
  .wordmark {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .22em;
    color: var(--ink);
  }
  .wordmark em {
    font-style: normal;
    font-weight: 400;
    color: var(--ink-soft);
    letter-spacing: .1em;
    margin-left: .5em;
    font-size: 10px;
  }
  #layer {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .14em;
    color: var(--ink-soft);
  }
  #layer.hot { color: #b8431a; }

  /* ---------- display window ---------- */

  .window {
    flex: none;
    margin: 0 12px;
    height: 170px;
    background: var(--window);
    border-radius: 2px;
    box-shadow:
      inset 0 2px 5px rgba(0,0,0,.85),
      0 1px 0 rgba(255,255,255,.4);
    position: relative;
    overflow: hidden;
  }
  #scope { display: block; width: 100%; height: 100%; }

  .readout {
    position: absolute;
    left: 10px; top: 8px;
    font: 500 11px/1.5 ui-monospace, "SF Mono", Menlo, monospace;
    color: #8c8176;
    letter-spacing: .02em;
    pointer-events: none;
  }
  .readout { white-space: pre; }

  /* ---------- step lamps ---------- */

  .steps {
    flex: none;
    height: 26px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 14px;
    position: relative;
  }
  .lamp {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--led-dim);
    box-shadow: inset 0 1px 1px rgba(0,0,0,.6);
  }
  .lamp.beat { background: #6a3a2c; }
  .lamp.on   { background: var(--led); box-shadow: 0 0 7px rgba(255,59,31,.9); }
  .lamp.acc  { background: var(--led-acc); box-shadow: 0 0 9px rgba(255,210,74,.9); }

  /* ---------- knobs ---------- */

  .knobs {
    flex: 1 1 auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    align-content: center;
    padding: 2px 10px 0;
    position: relative;
  }
  .pot {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 7px;
  }
  .dial {
    width: 74px; height: 74px;
    border-radius: 50%;
    position: relative;
    background:
      radial-gradient(circle at 50% 32%, #3c3f44 0%, var(--knob) 52%, #191b1e 100%);
    box-shadow:
      0 2px 4px rgba(0,0,0,.45),
      0 0 0 3px rgba(0,0,0,.14),
      inset 0 1px 1px rgba(255,255,255,.14);
  }
  /* skirt ticks */
  .dial::before {
    content: "";
    position: absolute; inset: -9px;
    border-radius: 50%;
    background:
      conic-gradient(from 215deg,
        rgba(0,0,0,.34) 0 .6deg, transparent .6deg 32.5deg,
        rgba(0,0,0,.34) 32.5deg 33.1deg, transparent 33.1deg 65deg,
        rgba(0,0,0,.34) 65deg 65.6deg, transparent 65.6deg 97.5deg,
        rgba(0,0,0,.34) 97.5deg 98.1deg, transparent 98.1deg 130deg,
        rgba(0,0,0,.34) 130deg 130.6deg, transparent 130.6deg 162.5deg,
        rgba(0,0,0,.34) 162.5deg 163.1deg, transparent 163.1deg 195deg,
        rgba(0,0,0,.34) 195deg 195.6deg, transparent 195.6deg 227deg,
        rgba(0,0,0,.34) 227deg 227.6deg, transparent 227.6deg 360deg);
    -webkit-mask: radial-gradient(circle, transparent 0 37px, #000 37px 43px, transparent 43px);
    mask: radial-gradient(circle, transparent 0 37px, #000 37px 43px, transparent 43px);
  }
  .pointer {
    position: absolute;
    left: 50%; top: 50%;
    width: 3px; height: 32px;
    margin-left: -1.5px;
    transform-origin: 50% 100%;
    border-radius: 2px;
    background: linear-gradient(#ff8a44, var(--trace));
    box-shadow: 0 0 5px rgba(255,106,31,.5);
    transform: translateY(-100%) rotate(-135deg);
  }
  .pot .cap {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .15em;
    color: var(--ink);
    text-transform: uppercase;
  }
  .pot .val {
    font: 500 11px/1 ui-monospace, "SF Mono", Menlo, monospace;
    color: var(--ink-soft);
    margin-top: -4px;
  }
  .pot.live .cap { color: #b8431a; }

  /* ---------- footer ---------- */

  footer {
    flex: none;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 9px;
    letter-spacing: 0;
    color: var(--ink-soft);
    white-space: nowrap;
  }

  /* ---------- start gate ---------- */

  #gate {
    position: fixed; inset: 0;
    background: var(--window);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    z-index: 40;
    padding: 0 34px;
    text-align: center;
  }
  #gate h1 {
    font-size: 15px; font-weight: 700;
    letter-spacing: .3em;
    color: var(--trace);
  }
  #gate p {
    font-size: 13px; line-height: 1.7;
    color: #8c8176;
    font-weight: 400;
  }
  #gate .pulse {
    width: 44px; height: 44px; border-radius: 50%;
    border: 2px solid var(--trace);
    animation: pulse 1.5s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: .25; transform: scale(.86); }
    50%      { opacity: 1;   transform: scale(1); }
  }
  #gate.gone { display: none; }
  #err { color: #d4542a; font-size: 12px; line-height: 1.6; }

  @media (prefers-reduced-motion: reduce) {
    .pulse { animation: none; opacity: .8; }
  }
</style>
</head>
<body>

<div id="rig" aria-hidden="true">
  <header>
    <span class="wordmark">FLIP ACID<em id="ver"></em></span>
    <span id="layer">CUTOFF / RESO</span>
  </header>

  <div class="window">
    <canvas id="scope"></canvas>
    <div class="readout" id="readout"></div>
  </div>

  <div class="steps" id="steps"></div>

  <div class="knobs">
    <div class="pot" data-k="cut"><div class="dial"><i class="pointer"></i></div><span class="cap">cutoff</span><span class="val"></span></div>
    <div class="pot" data-k="res"><div class="dial"><i class="pointer"></i></div><span class="cap">resonance</span><span class="val"></span></div>
    <div class="pot" data-k="env"><div class="dial"><i class="pointer"></i></div><span class="cap">env mod</span><span class="val"></span></div>
    <div class="pot" data-k="dec"><div class="dial"><i class="pointer"></i></div><span class="cap">decay</span><span class="val"></span></div>
  </div>

  <footer id="foot">A 新パターン · B 波形 · SELECT 自動変化 · START 停止 · L2 画面の高さ</footer>
</div>

<div id="gate">
  <h1>FLIP ACID</h1>
  <div class="pulse"></div>
  <p>パッドのボタンをどれか押すと鳴りはじめます。<br>画面をタップしても始まります。</p>
  <p id="err"></p>
</div>


<!-- ============ UI : runs on the main thread ============ -->
<script>
(function () {
  "use strict";

  var VERSION = "v0.1.0";
  document.getElementById("ver").textContent = VERSION;

  /* cache the whole thing, so it still plays with no signal */
  if ("serviceWorker" in navigator && location.protocol !== "file:") {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }

  /* ---------------- the visible strip ---------------- */

  /* How much screen the pad leaves showing. Measured at 575 on a 16 Pro Max;
     L2 + up/down trims it on the device and it sticks from then on. */
  var lid = 575;
  try {
    var saved = parseInt(localStorage.getItem("flipacid.lid"), 10);
    if (saved >= 320 && saved <= 1200) lid = saved;
  } catch (e) {}
  var q = location.search.match(/[?&]lid=(\d+)/);
  if (q) lid = Math.max(320, Math.min(1200, parseInt(q[1], 10)));

  document.documentElement.style.setProperty("--lid", Math.round(lid) + "px");

  var lidSaveAt = 0;
  function setLid(px) {
    lid = Math.max(320, Math.min(window.innerHeight || 1200, px));
    document.documentElement.style.setProperty("--lid", Math.round(lid) + "px");
    sizeCanvas();
    lidSaveAt = performance.now() + 800;
  }

  /* ---------------- parameters ---------------- */

  var P = {
    cut: { v: 0.42, lo: 70,   hi: 9000, log: true,  cap: "cutoff"    },
    res: { v: 0.64, lo: 0,    hi: 1,    log: false, cap: "resonance" },
    env: { v: 0.55, lo: 0,    hi: 1,    log: false, cap: "env mod"   },
    dec: { v: 0.38, lo: 0,    hi: 1,    log: false, cap: "decay"     },
    bpm: { v: 0.42, lo: 92,   hi: 168,  log: false, cap: "tempo"     },
    acc: { v: 0.60, lo: 0,    hi: 1,    log: false, cap: "accent"    }
  };

  function real(k) {
    var p = P[k];
    return p.log
      ? p.lo * Math.pow(p.hi / p.lo, p.v)
      : p.lo + (p.hi - p.lo) * p.v;
  }

  /* layers: which pair the d-pad drives */
  var LAYERS = [
    { tag: "CUTOFF / RESO",   y: "cut", x: "res" },
    { tag: "ENV MOD / DECAY", y: "env", x: "dec" },
    { tag: "TEMPO / ACCENT",  y: "bpm", x: "acc" },
    { tag: "画面の高さ",       y: null,  x: null }   /* L2: fit to the pad */
  ];
  var layer = 0;

  /* ---------------- audio ---------------- */

  var ctx = null, node = null, started = false;
  var live = { s: -1, f: 420, e: 0, a: 0, p: null };

  function send(t, k, v) {
    if (node) node.port.postMessage({ t: t, k: k, v: v });
  }
  function push(k) { send("p", k, real(k)); }

  function boot(how) {
    if (started) return;
    started = true;

    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) { fail("このブラウザは Web Audio に対応していません。"); return; }

    try { ctx = new AC({ latencyHint: "interactive" }); }
    catch (e) { fail("AudioContext を作れませんでした。"); return; }

    ctx.audioWorklet.addModule("acid.js").then(function () {
      node = new AudioWorkletNode(ctx, "acid", { outputChannelCount: [1] });
      node.port.onmessage = function (ev) {
        var d = ev.data;
        live.s = d.s; live.f = d.f; live.e = d.e; live.a = d.a;
        if (d.p) live.p = d.p;
      };
      node.connect(ctx.destination);
      ["cut", "res", "env", "dec", "bpm", "acc"].forEach(push);
      return ctx.resume();
    }).then(function () {
      document.getElementById("gate").classList.add("gone");
      document.getElementById("rig").setAttribute("aria-hidden", "false");
    }).catch(function (e) {
      fail("音の初期化に失敗しました（" + how + "）: " + (e && e.message ? e.message : e));
    });
  }

  function fail(msg) {
    started = false;
    document.getElementById("err").textContent = msg;
  }

  document.getElementById("gate").addEventListener("click", function () { boot("tap"); });
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && ctx && ctx.state === "suspended") ctx.resume();
  });

  /* ---------------- step lamps ---------------- */

  var lamps = [], stepBox = document.getElementById("steps");
  for (var i = 0; i < 16; i++) {
    var l = document.createElement("i");
    l.className = "lamp" + (i % 4 === 0 ? " beat" : "");
    stepBox.appendChild(l);
    lamps.push(l);
  }

  /* ---------------- knobs ---------------- */

  var pots = {};
  Array.prototype.forEach.call(document.querySelectorAll(".pot"), function (el) {
    pots[el.dataset.k] = {
      root: el,
      ptr: el.querySelector(".pointer"),
      cap: el.querySelector(".cap"),
      val: el.querySelector(".val")
    };
  });

  function fmt(k) {
    var r = real(k);
    if (k === "cut") return (r >= 1000 ? (r / 1000).toFixed(2) + "k" : Math.round(r)) + " Hz";
    if (k === "bpm") return Math.round(r) + " BPM";
    if (k === "dec") return Math.round(35 * Math.pow(1.5 / 0.035, P.dec.v)) + " ms";
    return Math.round(P[k].v * 100) + "";
  }

  /* the four dials: the first two never move, the back pair follows the layer */
  var SLOTS = ["cut", "res", "env", "dec"];
  var knobSig = "";

  function paintKnobs() {
    var L = LAYERS[layer];
    var shown = (layer === 2) ? ["cut", "res", "bpm", "acc"] : SLOTS;

    var sig = layer + "|";
    for (var s = 0; s < 4; s++) sig += P[shown[s]].v.toFixed(4) + ",";
    if (sig === knobSig) return;
    knobSig = sig;

    for (var i = 0; i < 4; i++) {
      var k = shown[i];
      var pot = pots[SLOTS[i]];
      pot.ptr.style.transform =
        "translateY(-100%) rotate(" + (-135 + P[k].v * 270) + "deg)";
      pot.cap.textContent = P[k].cap;
      pot.val.textContent = fmt(k);
      pot.root.classList.toggle("live", k === L.x || k === L.y);
    }
  }

  /* ---------------- scope ---------------- */

  var cvs = document.getElementById("scope"), g2 = cvs.getContext("2d");
  var cw = 0, chh = 0;

  function sizeCanvas() {
    var r = cvs.getBoundingClientRect();
    var dpr = Math.min(window.devicePixelRatio || 1, 3);
    cw = r.width; chh = r.height;
    cvs.width = Math.round(cw * dpr);
    cvs.height = Math.round(chh * dpr);
    g2.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  var F_LO = 24, F_HI = 18000, LOG_LO = Math.log(F_LO), LOG_SPAN = Math.log(F_HI) - LOG_LO;

  function xOf(f) { return (Math.log(f) - LOG_LO) / LOG_SPAN * cw; }

  /* |H| of a 3-pole ladder with feedback k, cutoff fc */
  function mag(f, fc, k) {
    var w = f / fc;
    /* one pole: 1/(1+jw) */
    var d = 1 + w * w;
    var re = 1 / d, im = -w / d;
    /* cube it */
    var re2 = re * re - im * im, im2 = 2 * re * im;
    var re3 = re2 * re - im2 * im, im3 = re2 * im + im2 * re;
    /* H = G3 / (1 + k G3) */
    var dr = 1 + k * re3, di = k * im3;
    var dd = dr * dr + di * di;
    if (dd < 1e-12) return 60;
    var hr = (re3 * dr + im3 * di) / dd;
    var hi = (im3 * dr - re3 * di) / dd;
    /* same makeup the DSP applies, so the trace matches what you hear */
    return Math.sqrt(hr * hr + hi * hi) * (1 + k * 0.25);
  }

  var DB_TOP = 22, DB_BOT = -46;
  function yOf(db) {
    if (db > DB_TOP) db = DB_TOP;
    if (db < DB_BOT) db = DB_BOT;
    return (DB_TOP - db) / (DB_TOP - DB_BOT) * chh;
  }

  function curve(fc, k, color, width, alpha) {
    g2.beginPath();
    for (var px = 0; px <= cw; px += 2) {
      var f = Math.exp(LOG_LO + px / cw * LOG_SPAN);
      var db = 20 * Math.log(mag(f, fc, k)) / Math.LN10;
      var y = yOf(db);
      if (px === 0) g2.moveTo(px, y); else g2.lineTo(px, y);
    }
    g2.globalAlpha = alpha;
    g2.strokeStyle = color;
    g2.lineWidth = width;
    g2.lineJoin = "round";
    g2.stroke();
    g2.globalAlpha = 1;
  }

  function drawScope() {
    g2.clearRect(0, 0, cw, chh);

    /* grid: decade lines */
    g2.strokeStyle = "#272b31";
    g2.lineWidth = 1;
    [100, 1000, 10000].forEach(function (f) {
      var x = Math.round(xOf(f)) + 0.5;
      g2.beginPath(); g2.moveTo(x, 0); g2.lineTo(x, chh); g2.stroke();
    });
    var y0 = Math.round(yOf(0)) + 0.5;
    g2.beginPath(); g2.moveTo(0, y0); g2.lineTo(cw, y0); g2.stroke();

    var k = P.res.v * 8.7;

    /* where the knob sits, dimmed */
    curve(real("cut"), k, "#6d4027", 1.5, 1);

    /* where the envelope has pushed it, bright */
    var fc = Math.max(28, Math.min(live.f, 18000));
    curve(fc, k, "#ff6a1f", 2, 1);

    /* cutoff marker */
    var mx = xOf(fc);
    g2.strokeStyle = "rgba(255,106,31,.3)";
    g2.lineWidth = 1;
    g2.beginPath(); g2.moveTo(mx, 0); g2.lineTo(mx, chh); g2.stroke();

    g2.fillStyle = live.a ? "#ffd24a" : "#ff6a1f";
    g2.beginPath(); g2.arc(mx, yOf(20 * Math.log(mag(fc, fc, k)) / Math.LN10), 3.5, 0, 6.2832);
    g2.fill();
  }

  /* ---------------- gamepad ---------------- */

  /* 8BitDo FlipPad reports mapping "" on iOS, so the indices are fixed by
     hand from what the pad actually sent. If resonance turns the wrong way,
     swap LEFT and RIGHT here and nothing else needs touching. */
  var B = {
    LEFT: 14, RIGHT: 15,
    UP: 12, DOWN: 13,
    A: 0, B: 1, X: 2, Y: 3,
    L1: 4, L2: 6,
    SELECT: 8, START: 9
  };

  /* The pad logged R1 and R2 as 7 and 5 in one pass and the usual 5 and 7 in
     another, so which is which is still unsettled. R2 has no other job, so
     either one opens the tempo layer and the question stops mattering. */
  var R_MOD = [5, 7];

  var prev = [], hold = { x: 0, y: 0 }, last = performance.now();
  var wave = 0, running = true, autoMut = true;

  function pad() {
    var list = navigator.getGamepads ? navigator.getGamepads() : [];
    for (var i = 0; i < list.length; i++) if (list[i]) return list[i];
    return null;
  }

  function down(gp, i) { return !!(gp.buttons[i] && gp.buttons[i].pressed); }
  function hit(gp, i)  { return down(gp, i) && !prev[i]; }

  function turn(key, dir, dt, held) {
    var p = P[key];
    var rate = 0.15 + Math.min(held, 1.4) * 0.32;  /* accelerate while held */
    p.v = Math.max(0, Math.min(1, p.v + dir * rate * dt));
    push(key);
  }

  function readPad(dt) {
    var gp = pad();
    if (!gp) return;

    if (!started) {
      for (var i = 0; i < gp.buttons.length; i++) {
        if (down(gp, i)) { boot("pad"); break; }
      }
    }

    var up = down(gp, B.UP), dn = down(gp, B.DOWN);
    var lf = down(gp, B.LEFT), rt = down(gp, B.RIGHT);

    /* L2 turns the d-pad into a ruler for the strip the pad leaves showing */
    if (down(gp, B.L2)) {
      layer = 3;
      if (up !== dn) setLid(lid + (up ? 70 : -70) * dt);
      hold.x = hold.y = 0;
      for (var b = 0; b < 18; b++) prev[b] = down(gp, b);
      return;
    }

    /* otherwise the shoulders pick which pair the d-pad drives */
    var rHeld = down(gp, R_MOD[0]) || down(gp, R_MOD[1]);
    layer = down(gp, B.L1) ? 1 : (rHeld ? 2 : 0);
    var L = LAYERS[layer];

    if (up !== dn) { hold.y += dt; turn(L.y, up ? 1 : -1, dt, hold.y); } else hold.y = 0;
    if (lf !== rt) { hold.x += dt; turn(L.x, rt ? 1 : -1, dt, hold.x); } else hold.x = 0;

    if (hit(gp, B.A)) send("new");
    if (hit(gp, B.B)) { wave ^= 1; send("wave", null, wave); }
    if (hit(gp, B.SELECT)) { autoMut = !autoMut; send("mut", null, autoMut); }
    if (hit(gp, B.START))  { running = !running; send("run", null, running); }

    for (var j = 0; j < 18; j++) prev[j] = down(gp, j);
  }

  /* keyboard stand-in, so the thing can be built without the pad */
  var keys = {};
  window.addEventListener("keydown", function (e) {
    if (!started) boot("key");
    keys[e.key] = true;
    if (e.key === "a") send("new");
    if (e.key === "b") { wave ^= 1; send("wave", null, wave); }
    if (e.key.indexOf("Arrow") === 0 || e.key === " ") e.preventDefault();
  });
  window.addEventListener("keyup", function (e) { keys[e.key] = false; });

  function readKeys(dt) {
    layer = keys["Shift"] ? 1 : (keys["Control"] ? 2 : 0);
    var L = LAYERS[layer];
    var up = !!keys["ArrowUp"], dn = !!keys["ArrowDown"];
    var lf = !!keys["ArrowLeft"], rt = !!keys["ArrowRight"];
    if (up !== dn) { hold.y += dt; turn(L.y, up ? 1 : -1, dt, hold.y); } else hold.y = 0;
    if (lf !== rt) { hold.x += dt; turn(L.x, rt ? 1 : -1, dt, hold.x); } else hold.x = 0;
  }

  /* ---------------- loop ---------------- */

  var lastStep = -1, lastLayer = -1, lastRead = "";
  var layerEl = document.getElementById("layer");
  var readEl  = document.getElementById("readout");

  function frame(now) {
    var dt = Math.min((now - last) / 1000, 0.05);
    last = now;

    if (pad()) readPad(dt); else readKeys(dt);

    if (layer === 3) {
      layerEl.textContent = Math.round(lid) + " px";
      layerEl.classList.add("hot");
      lastLayer = -1;
    } else if (layer !== lastLayer) {
      lastLayer = layer;
      layerEl.textContent = LAYERS[layer].tag;
      layerEl.classList.toggle("hot", layer !== 0);
    }

    if (lidSaveAt && now > lidSaveAt) {
      lidSaveAt = 0;
      try { localStorage.setItem("flipacid.lid", String(Math.round(lid))); } catch (e) {}
    }

    if (started) {
      drawScope();

      if (live.s !== lastStep) {
        lastStep = live.s;
        for (var i = 0; i < 16; i++) {
          var st = live.p ? live.p[i] : null;
          lamps[i].className = "lamp" +
            (i % 4 === 0 ? " beat" : "") +
            (i === live.s && st && st.on ? (st.a ? " acc" : " on") : "");
        }
      }

      var txt = "cut " + Math.round(live.f) + " Hz   res " +
        Math.round(P.res.v * 100) + "   " + (wave ? "square" : "saw") +
        (running ? "" : "   — 停止") + (autoMut ? "" : "   固定");
      if (txt !== lastRead) { lastRead = txt; readEl.textContent = txt; }
    }

    paintKnobs();
    requestAnimationFrame(frame);
  }

  window.addEventListener("resize", sizeCanvas);
  sizeCanvas();
  paintKnobs();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
